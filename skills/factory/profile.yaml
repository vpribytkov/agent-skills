# Public home defaults. First install: copy to profile.yaml beside global SKILL.md.
# There is exactly one active profile per machine. Preserve it during updates.
version: 1

work_items:
  provider: github
  identifiers:
    owner: vpribytkov
    repository: from_git_origin
    project_id: null # Optional. This machine currently lacks read:project access.
    status_field_id: null
    status_options: {}
  operations:
    read: 'GitHub connector: read issue, comments, dependencies and linked PRs.'
    candidates: |
      Read every current open issue in the resolved repository, including all
      pages. Read linked dependencies and PRs needed to assess readiness.
      Prefer the GitHub connector; use gh for unsupported reads.
    active: |
      gh search issues --owner vpribytkov --include-prs --match comments --json number,url,repository --limit 1000 "FACTORY START"
      Exhaust pagination through the GitHub API if the result reaches the limit.
    record: 'GitHub source-issue comments via gh api; pass comment JSON through a temporary file or stdin when the connector only supports PR comments.'
  transitions:
    started: 'Source issue comment: FACTORY START, item/repo/change/PR links as available.'
    suspended: 'Source issue comment: FACTORY SUSPENDED.'
    ready_to_merge: 'Source issue comment: READY TO MERGE with finalized PR and archive links; keep issue open.'
    merged: 'No factory action; human merge uses the PR closing reference.'

repository:
  context:
    - CONTEXT.md
    - docs/strategy.md
    - docs/decisions.md
    - docs/domain/gameplay-context.md
    - openspec/config.yaml
    - openspec/specs/
  openspec_command: 'C:/Users/Shaedar/AppData/Roaming/npm/openspec.cmd'
  branch_template: 'issue/{item_number}-{slug}'

prioritization_prompt: |
  Помогай приоритизировать issues LocalAge 2.

  Принцип приоритизации:
  1. Сначала задачи, которые прямо двигают ближайший рабочий gameplay loop.
  2. Перед ними допустим небольшой infrastructure/test debt, если он уже мешает текущей разработке и будет повторно удорожать несколько следующих задач.
  3. Сначала закрывай уже почти законченные изменения, если переключение не даёт явного выигрыша.
  4. Foundational fixes выше новых features, если текущая база даёт неправильное или нестабильное поведение.
  5. Не поднимай общую архитектурную уборку, CI и документационный debt выше gameplay без конкретного блокирующего эффекта.
  6. Предпочитай маленький ограниченный slice более крупной универсальной системе, если оба дают сопоставимый продуктовый результат.
  7. Учитывай зависимости: сначала то, что делает следующие 2–3 задачи проще, надёжнее или дешевле.
  8. Отдельно отмечай задачи, которые можно безопасно вести параллельно.

  Для каждого пересмотра backlog:
  - посмотри актуальные открытые GitHub issues;
  - предложи короткую очередь ближайших 5–8 задач;
  - для первых 3 объясни по 1–2 предложения, почему именно такой порядок;
  - явно скажи, если старый приоритет больше не актуален из-за новых issues или закрытых задач.
  Перед каждой рекомендацией «что делать дальше» обязательно перечитай актуальный список открытых GitHub issues; не полагайся только на предыдущий порядок из чата.

blocks:
  explore:
    enabled: true
    model: gpt-6.1-sol
    reasoning: high
    skills:
      requirements: grill-with-docs
      investigate: openspec-explore
      propose: openspec-propose
      summary: openspec-summarize-change
      spec_review: openspec-review-change
      revise: openspec-update-change
  develop:
    enabled: true
    model: gpt-6-luna
    reasoning: high
    escalation:
      model: gpt-6.1-sol
      reasoning: high
      when: Difficult cross-component or recovery work.
    skills:
      apply: openspec-apply-change
      pr: create-pr
    commands:
      verify: 'Repository AGENTS.md: canonical verification commands.'
  review:
    enabled: true
    model: gpt-6.1-sol
    reasoning: high
    skills:
      review: code-review-skill
  owner_review:
    enabled: true
    model: gpt-6.1-sol
    reasoning: high
    skills:
      sync: 'openspec-sync-specs (inline workflow in openspec-archive-change)'
      archive: openspec-archive-change

review:
  provider: skill
  identifiers: {}
  operations:
    read: 'Read GitHub PR diff, reviews, comments and checks at its current head/base.'
    publish: 'Publish material findings and PASS/CHANGES in the PR using GitHub review/comment tools, recording reviewed head/base; use a PR comment if self-review is unavailable.'

pr:
  provider: github
  identifiers:
    repository: from_git_origin
    base: master
  operations:
    read: 'Read the linked GitHub PR, head/base, draft state, reviews and required checks.'
    update: 'Update the same PR with sections: Что изменено; Зачем это нужно; Как это сделано. Include the issue closing reference and current verification evidence.'
    ready: 'gh pr ready {pr} --repo {repo}'
