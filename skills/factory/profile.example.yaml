# Optional machine-local bindings. Copy to profile.yaml only when needed.
# profile.yaml is ignored by Git; keep credentials in authenticated tools.
version: 2

state:
  provider: work_items # Or filesystem, with an absolute directory below.
  # directory: /absolute/path/to/factory-receipts

work_items:
  provider: github
  identifiers:
    repository: from_git_origin
  operations:
    read: 'Read the item, comments, dependencies and linked PRs.'
    candidates: 'Read current candidate items with pagination and dependencies.'
    active: 'Read unfinished job records before selecting a checkout.'
    record: 'Update this item’s concise progress, approval and evidence record.'
  transitions: {} # Optional exact provider actions; never implies merge.

repository:
  openspec_command: openspec
  openspec_store: null
  openspec_change_template: null
  branch_template: '{item_lower}-{slug}'
  context: [] # Additional project paths; applicable AGENTS.md always applies.

# Required only by /factory next. Replace null with your exact policy using |.
prioritization_prompt: null

review:
  source: independent # A fresh reviewer; external is an explicit alternative.
  skill: null # Optional explicit ensemble-code-review; not loaded by default.
  required_checks: [] # Additional check names; repository-required checks still apply.
  external: null # For source: external, bind provider/identifiers/operations here.

pr:
  provider: github
  identifiers:
    repository: from_git_origin
    base: from_remote_default
  operations: {} # Optional provider-specific read/update/ready bindings.
